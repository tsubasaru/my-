<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUNGEON SCRAP — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0807;--panel:#131010;--panel2:#1a1414;--panel3:#221a19;--line:#2f2421;--line2:#45332e;
  --ink:#eee4da;--mute:#8f8077;--dim:#5d514b;
  --acid:#a6ff3d;--blood:#ff3b47;--gold:#ffc93c;--cyan:#38e8ff;--violet:#b45cff;--pink:#ff2d6f;
  --qS:#ffd23f;--qA:#79ff6a;--qB:#55b8ff;--qX:#ff4d4d;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --disp:"Bungee",Impact,"Arial Black",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#2a1012 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#0d1d22 0%,transparent 60%),var(--bg);color:var(--ink);font:13px/1.35 Inter,system-ui,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* ---------- top bar ---------- */
#topbar{height:54px;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(#1a1211,#0e0b0a)}
.logo{font-family:var(--disp);font-size:22px;letter-spacing:.02em;color:var(--blood);text-shadow:0 0 14px rgba(255,59,71,.55),2px 2px 0 #000;white-space:nowrap}
.logo b{color:var(--ink);font-weight:400}
.logo small{display:block;font:600 9px/1 Inter,sans-serif;letter-spacing:.28em;color:var(--mute);text-shadow:none;margin-top:3px}
.hstat{display:flex;flex-direction:column;gap:2px;min-width:0}
.hstat span{font-size:9px;letter-spacing:.2em;color:var(--mute);font-weight:800;text-transform:uppercase}
.hstat b{font-family:var(--mono);font-size:15px;font-weight:800;white-space:nowrap}
#hMoney{font-size:24px;color:var(--gold);text-shadow:0 0 16px rgba(255,201,60,.45);transition:transform .08s}
#hMoney.bump{transform:scale(1.12)}
.spacer{flex:1}
.tbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-weight:800;font-size:11px;letter-spacing:.08em}
.tbtn:hover{border-color:var(--acid);color:var(--acid)}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:minmax(440px,1.5fr) minmax(300px,.82fr) minmax(360px,1.02fr);gap:10px;padding:10px;height:calc(100vh - 54px)}
.pane{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03)}
.paneHead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:900;font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;flex:0 0 auto}
.paneHead .tag{color:var(--blood)}

/* ---------- table ---------- */
#tableWrap{position:relative;flex:1;min-height:0}
#tableCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
#monTag{display:flex;align-items:center;gap:8px;color:var(--ink);letter-spacing:.06em}
#monTag .tier{font-family:var(--mono);color:var(--mute)}
.vbadge{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:900;letter-spacing:.12em;color:#000}
#hud{position:absolute;left:0;right:0;top:16px;pointer-events:none;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start}
.prog{display:flex;flex-direction:column;gap:5px;width:190px}
.prog .bar{height:6px;background:#000a;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blood),var(--gold));width:0;transition:width .15s}
.prog .lbl{font-family:var(--mono);font-size:10px;color:var(--mute);display:flex;justify-content:space-between}
#combo{font-family:var(--disp);font-size:30px;color:var(--gold);text-shadow:0 0 18px rgba(255,201,60,.6),2px 2px 0 #000;opacity:0;transform-origin:right top;transition:opacity .2s;text-align:right;line-height:1}
#combo small{display:block;font:800 10px/1 var(--mono);letter-spacing:.2em;color:var(--ink);opacity:.8;margin-top:4px}
#hint{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);pointer-events:none;background:#000c;border:1px solid var(--line2);padding:7px 14px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.04em;white-space:nowrap;transition:opacity .3s;color:var(--acid)}
#haulBtn{position:absolute;right:12px;bottom:12px;background:linear-gradient(#3a1416,#230b0d);border:1px solid #6b2328;color:#ffb3b8;border-radius:8px;padding:9px 14px;font-family:var(--disp);font-size:13px;letter-spacing:.05em}
#haulBtn:hover{border-color:var(--blood);color:#fff;box-shadow:0 0 18px rgba(255,59,71,.4)}
#haulBtn.ready{background:linear-gradient(#2d4a12,#18290a);border-color:var(--acid);color:var(--acid);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(166,255,61,.45)}}

/* ---------- middle ---------- */
#paneMid .scroll{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.card{background:#0e0b0bcc;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.cardHead{display:flex;align-items:center;gap:8px;font-weight:900;font-size:10px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
.cardHead .r{margin-left:auto;display:flex;gap:5px}
.mini{background:var(--panel3);border:1px solid var(--line2);border-radius:4px;padding:2px 7px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ink)}
.mini:hover{border-color:var(--acid);color:var(--acid)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:11px}
.statgrid div{display:flex;justify-content:space-between;gap:6px;color:var(--mute)}
.statgrid b{font-family:var(--mono);color:var(--ink);font-weight:700}
#relicSlots{display:flex;gap:6px}
.rslot{flex:1;aspect-ratio:1;max-width:60px;border:1px dashed var(--line2);border-radius:8px;display:grid;place-items:center;font-size:26px;position:relative;background:#0008}
.rslot.on{border-style:solid;background:radial-gradient(circle,#2a1a2e,#0d0a0e);box-shadow:inset 0 0 14px rgba(180,92,255,.25)}
.rslot.on.common{border-color:#6c6c7a}.rslot.on.rare{border-color:var(--cyan)}.rslot.on.legendary{border-color:var(--gold);box-shadow:inset 0 0 16px rgba(255,201,60,.3),0 0 10px rgba(255,201,60,.15)}
.rslot.fire{animation:rfire .45s}
@keyframes rfire{30%{transform:scale(1.18) rotate(-6deg);filter:brightness(2)}}
#fridgeZone{transition:box-shadow .15s,border-color .15s}
#fridgeZone.hot{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(56,232,255,.25),0 0 30px rgba(56,232,255,.2)}
#fridgeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.fslot{aspect-ratio:1;border:1px dashed #263236;border-radius:7px;background:linear-gradient(#0b1416,#081012)}
.fitem{aspect-ratio:1;border:1px solid #2b4148;border-radius:7px;background:linear-gradient(#10232a,#0a151a);position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden;transition:transform .08s}
.fitem:hover{transform:translateY(-2px);border-color:var(--gold)}
.fitem .fico{font-size:24px;line-height:1;margin-top:-8px;filter:drop-shadow(0 2px 2px #000)}
.fitem .fq{position:absolute;left:3px;top:2px;font:900 10px/1 var(--mono)}
.fitem .fprice{position:absolute;left:0;right:0;bottom:7px;text-align:center;font:700 9.5px/1 var(--mono);color:var(--gold)}
.fitem .fbar{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#000;border-radius:2px;overflow:hidden}
.fitem .fbar i{display:block;height:100%;background:var(--acid)}
.fitem.rot{filter:saturate(.3) brightness(.7)}
.fitem.rot::after{content:"ROT";position:absolute;right:3px;top:2px;font:900 8px/1 var(--mono);color:#9c8f3a}
.fitem.new{animation:fin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes fin{from{transform:scale(.2);filter:brightness(3)}}
.v-golden{box-shadow:inset 0 0 12px rgba(255,204,51,.55);border-color:#a8841f!important}
.v-crystal{box-shadow:inset 0 0 12px rgba(127,243,255,.55);border-color:#3fa7b5!important}
.v-cursed{box-shadow:inset 0 0 12px rgba(180,92,255,.6);border-color:#7240a3!important}
.v-abyssal{box-shadow:inset 0 0 14px rgba(255,45,111,.7);border-color:#a3204d!important;animation:abyss 1.6s infinite}
@keyframes abyss{50%{box-shadow:inset 0 0 22px rgba(255,45,111,.95)}}
.qS{color:var(--qS)}.qA{color:var(--qA)}.qB{color:var(--qB)}.qX{color:var(--qX)}
#quickSell{border:2px dashed #6b2328;border-radius:10px;padding:12px;text-align:center;background:repeating-linear-gradient(-45deg,#1a0b0c 0 10px,#140809 10px 20px);transition:all .15s}
#quickSell b{font-family:var(--disp);font-size:15px;color:#ff8d94;letter-spacing:.04em}
#quickSell small{display:block;color:var(--mute);font-size:10px;margin-top:3px}
#quickSell.hot{border-color:var(--blood);box-shadow:0 0 28px rgba(255,59,71,.4);transform:scale(1.02)}
#receipt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:30px;font-family:var(--mono);font-size:11px}
#receipt .chip{padding:3px 6px;border-radius:4px;background:var(--panel3);border:1px solid var(--line2);animation:chip .3s cubic-bezier(.2,1.8,.4,1) both;white-space:nowrap}
#receipt .chip.base{background:#1c2a12;border-color:#3d5c1f;color:var(--acid)}
#receipt .chip.q{color:var(--qS)}
#receipt .chip.mkt{color:var(--cyan)}
#receipt .chip.relic{color:#e0b3ff;border-color:#5b3577;background:#1d1224}
#receipt .chip.bad{color:#ff8d94}
#receipt .op{color:var(--dim);animation:chip .3s both}
#receipt .total{font-family:var(--disp);font-size:18px;color:var(--gold);text-shadow:0 0 12px rgba(255,201,60,.5);animation:chip .45s cubic-bezier(.2,1.8,.4,1) both;margin-left:4px}
#receipt .cnt{color:var(--mute);margin-left:4px}
@keyframes chip{from{opacity:0;transform:translateY(6px) scale(.6)}}

/* ---------- right ---------- */
.monitor{flex:0 0 auto;display:flex;flex-direction:column;background:linear-gradient(#071214,#050c0e);border-bottom:1px solid #12323a;position:relative;height:53%;min-height:300px}
.monitor::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.monitor .paneHead{color:var(--cyan);border-color:#12323a}
.live{color:var(--blood);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#ticker{height:24px;overflow:hidden;white-space:nowrap;background:#000;border-bottom:1px solid #12323a;position:relative;font:700 11px/24px var(--mono);color:var(--gold)}
#tickerText{display:inline-block;padding-left:100%;animation:marquee 22s linear infinite}
@keyframes marquee{to{transform:translateX(-100%)}}
#activeNews{display:flex;gap:5px;flex-wrap:wrap;padding:5px 8px;min-height:30px}
.nchip{font:700 10px/1 var(--mono);padding:4px 6px;border-radius:4px;border:1px solid;position:relative;overflow:hidden}
.nchip.up{color:var(--acid);border-color:#3d5c1f;background:#0f1a07}
.nchip.dn{color:#ff8d94;border-color:#6b2328;background:#1a0809}
.nchip.rumor{color:var(--violet);border-color:#5b3577;background:#140b1a}
.nchip i{position:absolute;left:0;bottom:0;height:2px;background:currentColor;opacity:.7}
#chartBox{position:relative;height:120px;flex:0 0 auto;margin:0 8px}
#chart{width:100%;height:100%;display:block}
#chartLbl{position:absolute;left:6px;top:4px;font:700 11px/1.2 var(--mono);color:var(--ink);pointer-events:none;text-shadow:0 1px 2px #000}
#mktList{overflow:auto;flex:1;min-height:0;padding:4px 6px 6px}
.mrow{display:grid;grid-template-columns:22px 1fr 58px 26px 64px 58px;gap:5px;align-items:center;padding:4px 5px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.mrow:hover{background:#0c1d22}
.mrow.sel{border-color:#1e5361;background:#0b1a1e}
.mrow .ico{font-size:16px;text-align:center}
.mrow .nm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mul{font:800 11px/1 var(--mono);text-align:right}
.mrow .arr{font:900 11px/1 var(--mono);text-align:center}
.mrow .px{font:700 10.5px/1 var(--mono);color:var(--gold);text-align:right}
.mrow.flash{animation:rowflash .7s}
@keyframes rowflash{0%{background:#3b2f08}}
.up{color:var(--acid)}.dn{color:#ff6b74}.flat{color:var(--mute)}
.sellall{background:#22110f;border:1px solid #5a2a24;border-radius:4px;padding:3px 4px;font:800 9.5px/1 var(--mono);color:#ffb3b8}
.sellall:disabled{opacity:.3;cursor:default}
.sellall:not(:disabled):hover{border-color:var(--blood);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 2px;font-weight:900;font-size:10px;letter-spacing:.12em;color:var(--mute);position:relative}
.tabs button.on{color:var(--ink);border-color:var(--blood)}
.tabs button .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--acid);display:none}
.tabs button.notify .dot{display:block}
#tabBody{overflow:auto;flex:1;min-height:0;padding:8px;display:flex;flex-direction:column;gap:6px}
.ucard{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#0e0b0b}
.ucard .uico{font-size:22px;text-align:center}
.ucard .un{font-weight:800;font-size:12px}
.ucard .un .lv{font-family:var(--mono);color:var(--mute);font-weight:700;margin-left:4px;font-size:10.5px}
.ucard .ud{font-size:10.5px;color:var(--mute);margin-top:1px}
.ucard .uv{font-family:var(--mono);font-size:10.5px;color:var(--cyan);margin-top:2px}
.buy{min-width:84px;background:linear-gradient(#2a3a10,#18240a);border:1px solid #4d7a1c;border-radius:6px;padding:7px 8px;font:800 11px/1 var(--mono);color:var(--acid)}
.buy:hover:not(.no){box-shadow:0 0 14px rgba(166,255,61,.35);color:#fff}
.buy.no{background:#161212;border-color:var(--line2);color:var(--dim);cursor:not-allowed}
.buy.max{background:#161212;border-color:var(--line2);color:var(--gold);cursor:default}
.sect{font-weight:900;font-size:10px;letter-spacing:.2em;color:var(--mute);margin:4px 2px 0;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sect .r{margin-left:auto}
.rcard{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:8px;border:1px solid var(--line2);background:radial-gradient(circle at 0 50%,#1c1220,#0e0b0e 70%)}
.rcard .rico{font-size:28px;text-align:center}
.rcard .rn{font-weight:900;font-size:12px}
.rcard .rr{font:800 9px/1 var(--mono);letter-spacing:.15em;margin-left:5px}
.rr.common{color:#a9a9b8}.rr.rare{color:var(--cyan)}.rr.legendary{color:var(--gold)}
.rcard .rd{font-size:10.5px;color:var(--mute);margin-top:2px}
.rcard.legendary{border-color:#7a5d17;box-shadow:inset 0 0 18px rgba(255,201,60,.12)}
.rcard.rare{border-color:#1e5361}
.ocard{padding:8px;border:1px solid var(--line2);border-radius:8px;background:#0e0b0b;display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;position:relative;overflow:hidden}
.ocard .oico{font-size:24px;text-align:center}
.ocard .ot{font-weight:800;font-size:12px}
.ocard .os{font:700 10.5px/1.3 var(--mono);color:var(--mute)}
.ocard .orw{font:800 11px/1.3 var(--mono);color:var(--gold)}
.ocard .otime{position:absolute;left:0;bottom:0;height:2px;background:var(--blood)}
.ocard .ob{display:flex;flex-direction:column;gap:4px}
.x{background:none;border:1px solid var(--line2);border-radius:4px;color:var(--mute);font-size:10px;padding:3px 5px}
.codexMon{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#0e0b0b}
.codexMon .ch{font-weight:900;font-size:11px;letter-spacing:.08em;margin-bottom:4px;display:flex;justify-content:space-between}
.crow{display:grid;grid-template-columns:1fr repeat(5,26px);gap:3px;align-items:center;font-size:11px;margin:2px 0}
.cc{height:22px;border-radius:4px;display:grid;place-items:center;background:#000;border:1px solid #221b19;font-size:13px}
.cc.got{border-color:currentColor}
.cc.lock{color:#332a27;font:900 10px var(--mono)}
.cbar{height:8px;background:#000;border-radius:5px;overflow:hidden;border:1px solid var(--line2)}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink))}

/* ---------- fx layer ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;white-space:nowrap;animation:popup 1.1s cubic-bezier(.2,1.4,.4,1) forwards;text-shadow:0 2px 0 #000,0 0 10px #000}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%) scale(.95)}}
.pop.scrap{font:800 11px var(--mono);color:#ffe28a;animation-duration:.8s}
.pop.cash{font:900 16px var(--mono);color:var(--gold)}
.pop.big{font-family:var(--disp);font-size:42px;color:var(--qS);text-shadow:0 0 24px rgba(255,210,63,.8),3px 3px 0 #000;animation-duration:1.4s}
.pop.rankA{font-family:var(--disp);font-size:30px;color:var(--qA);text-shadow:0 0 18px rgba(121,255,106,.6),3px 3px 0 #000}
.pop.rankB{font-family:var(--disp);font-size:26px;color:var(--qB);text-shadow:3px 3px 0 #000}
.pop.rankX{font-family:var(--disp);font-size:34px;color:var(--qX);text-shadow:0 0 18px rgba(255,77,77,.7),3px 3px 0 #000}
.pop.perfect{font-family:var(--disp);font-size:52px;background:linear-gradient(90deg,#ffd23f,#fff,#38e8ff,#ff2d6f,#ffd23f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(3px 3px 0 #000) drop-shadow(0 0 18px rgba(255,210,63,.6));animation:popup 1.6s cubic-bezier(.2,1.4,.4,1) forwards,shine .6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.pop.info{font:900 13px Inter,sans-serif;color:var(--cyan);letter-spacing:.06em}
.pop.warn{font:900 14px Inter,sans-serif;color:#ff8d94}
.pop.jack{font-family:var(--disp);font-size:48px;color:var(--gold);text-shadow:0 0 30px rgba(255,201,60,.9),4px 4px 0 #000;animation-duration:1.8s}
.coin{position:absolute;font-size:18px;filter:drop-shadow(0 0 6px rgba(255,201,60,.8))}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0}
#breaking{position:fixed;left:50%;top:62px;transform:translate(-50%,-160%);z-index:60;background:linear-gradient(#2a0d0f,#120506);border:2px solid var(--blood);border-radius:10px;padding:10px 18px;min-width:420px;max-width:80vw;text-align:center;box-shadow:0 10px 50px rgba(255,59,71,.4);transition:transform .45s cubic-bezier(.2,1.5,.4,1),opacity .25s;pointer-events:none;opacity:0}
#breaking.show{transform:translate(-50%,0);opacity:1}
#breaking .bk{font-family:var(--disp);color:var(--blood);font-size:12px;letter-spacing:.2em}
#breaking .bh{font-weight:900;font-size:15px;margin:3px 0}
#breaking .be{font:800 18px var(--mono)}
#breaking.rumor{border-color:var(--violet);box-shadow:0 10px 50px rgba(180,92,255,.35)}
#breaking.rumor .bk{color:var(--violet)}
#tip{position:fixed;z-index:70;pointer-events:none;background:#0b0909f2;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;max-width:290px;font-size:11.5px;display:none;box-shadow:0 8px 30px #000}
#tip .tt{font-weight:900;font-size:12.5px;margin-bottom:3px}
#tip .tl{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
#tip .tl b{color:var(--ink)}
#tip .tsum{border-top:1px solid var(--line2);margin-top:4px;padding-top:4px;font:900 13px var(--mono);color:var(--gold);display:flex;justify-content:space-between}
#ghost{position:fixed;z-index:80;pointer-events:none;display:none;transform:translate(-50%,-50%);font-size:40px;filter:drop-shadow(0 6px 10px #000)}
#ghost .gq{position:absolute;right:-12px;top:-8px;font:900 16px var(--disp);text-shadow:2px 2px 0 #000}
#ghost .gl{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:800 10px var(--mono);color:var(--gold);white-space:nowrap;text-shadow:0 1px 2px #000}
.modal{position:fixed;inset:0;background:#000b;z-index:90;display:none;place-items:center}
.modal.show{display:grid}
.modal .box{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:18px 22px;max-width:620px;max-height:85vh;overflow:auto;font-size:13px;line-height:1.55}
.modal h2{font-family:var(--disp);color:var(--blood);margin:0 0 8px;font-weight:400}
.modal li{margin:4px 0}
#dev{position:fixed;right:12px;bottom:12px;z-index:85;background:#0b0909f5;border:1px solid var(--acid);border-radius:8px;padding:8px;display:none;flex-direction:column;gap:5px;font:700 11px var(--mono);width:210px}
#dev.show{display:flex}
#dev .row{display:flex;gap:4px;flex-wrap:wrap}
#dev button{background:#1a2410;border:1px solid #3d5c1f;color:var(--acid);border-radius:4px;padding:3px 6px;font:700 10px var(--mono)}
@media (max-width:1150px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;height:auto}
  #paneTable{height:70vh}
  #paneMid,#paneRight{max-height:none}
  .monitor{height:auto}
  #mktList{max-height:300px}
}

<body>
<header id="topbar">
  <div class="logo">DUNGEON <b>SCRAP</b><small data-t="subtitle">DISSECTION &amp; BLACK MARKET</small></div>

  <button class="tbtn" id="btnSound">🔊</button>
  <button class="tbtn" id="btnDev">DEV</button>
</header>

<main id="app">
  <!-- LEFT: dissection table -->
  <section class="pane" id="paneTable">
    <div class="paneHead"><span class="tag" data-t="table">Butcher Table</span><span id="monTag"></span></div>

      <div id="hud">

          <div class="lbl"><span data-t="parts">PARTS</span><span id="pParts">0/0</span></div>
        </div>
        <div id="combo">×0<small>COMBO</small></div>
      </div>
      <div id="hint"></div>
      <button id="haulBtn">HAUL OUT ▶</button>
    </div>
  </section>

  <!-- MIDDLE: storage & status -->
  <section class="pane" id="paneMid">
    <div class="paneHead"><span data-t="workshop">Workshop</span></div>
    <div class="scroll">
      <div class="card">
        <div class="cardHead" data-t="toolReadout">Tool Readout</div>
        <div class="statgrid" id="toolStats"></div>
      </div>
      <div class="card">
        <div class="cardHead"><span data-t="relics">Dark Relics</span><span id="relicCount" class="mono"></span></div>
        <div id="relicSlots"></div>
      </div>
      <div class="card" id="fridgeZone">
        <div class="cardHead"><span data-t="storage">Cold Storage</span><span id="fridgeCount" class="mono"></span>
          <span class="r"><button class="mini" id="btnSort" data-t="sort">SORT</button><button class="mini" id="btnSellRot" data-t="sellRot">SELL ROT</button><button class="mini" id="btnSellAll" data-t="sellEverything">SELL ALL</button></span></div>
        <div id="fridgeGrid"></div>
      </div>
      <div id="quickSell"><b data-t="quickSell">💰 FENCE — QUICK SELL</b><small data-t="quickSellSub">drag a fresh part here to cash out instantly</small></div>
      <div class="card">
        <div class="cardHead" data-t="lastDeal">Last Deal</div>
        <div id="receipt"><span style="color:var(--dim)">—</span></div>
      </div>
    </div>
  </section>

  <!-- RIGHT: market & shop -->
  <section class="pane" id="paneRight">
    <div class="monitor">
      <div class="paneHead"><span class="live">●</span><span data-t="market">Black Market Monitor</span><span class="mono" style="margin-left:auto;color:var(--dim)" id="mktClock"></span></div>
      <div id="ticker"><span id="tickerText"></span></div>
      <div id="activeNews"></div>
      <div id="chartBox"><canvas id="chart"></canvas><div id="chartLbl"></div></div>
      <div id="mktList"></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="tool"><span data-t="tabTools">TOOLS</span><i class="dot"></i></button>
      <button data-tab="facility"><span data-t="tabFacility">FACILITY</span><i class="dot"></i></button>
      <button data-tab="relic"><span data-t="tabRelics">RELICS</span><i class="dot"></i></button>
      <button data-tab="orders"><span data-t="tabOrders">ORDERS</span><i class="dot"></i></button>
      <button data-tab="codex"><span data-t="tabCodex">CODEX</span><i class="dot"></i></button>
    </div>
    <div id="tabBody"></div>
  </section>
</main>

// Returns { total, lines:[{label, v, kind}] } — the full multiplier chain (Balatro-style receipt)
function salePrice(item, ctx = {}) {

  if (codexMult() > 1) lines.push({ label: 'CODEX', v: codexMult(), kind: 'relic' });

  if (ctx.quick) for (const e of relicEffects('sale_quick')) lines.push({ label: '📜', v: e.v, kind: 'relic' });
  for (const e of relicEffects('sale_per_stored')) { const n = G.fridge.length; if (n) lines.push({ label: '📒', v: 1 + n * e.v, kind: 'relic' }); }

function newsAffects(def, pid) {

// ---- orders
function genOrder() {
  const ups = unlockedParts();
  const maxTier = Math.max(...ups.map(p => MON_BY_ID[PARTS[p].monster].tier));
  let pool = ups.filter(p => MON_BY_ID[PARTS[p].monster].tier >= maxTier - 1);
  const fresh = pool.filter(p => !G.orders.some(o => o.partId === p)); if (fresh.length) pool = fresh;   // avoid duplicate orders
  const pid = pick(pool); const p = PARTS[pid];
  const count = randi(2, 4) + (Math.random() < .3 ? 1 : 0);
  const minQ = pick(['B', 'A', 'A', 'A', 'S']);
  const variant = Math.random() < 0.08 ? 'golden' : null;
  const reward = p.base * count * QUALITY[minQ].mult * (variant ? VARIANTS[variant].mult : 1) * BAL.orderRewardMult * rand(1, 1.5);
  return { id: G.uid++, partId: pid, count, minQ, variant, reward, relic: Math.random() < BAL.orderRelicChance, t: BAL.orderTime, max: BAL.orderTime };
}
function orderMatches(o) {

}

  const o = G.orders.find(x => x.id === id); if (!o) return;

  m.sort((a, b) => QUALITY[a.q].rank - QUALITY[b.q].rank || a.fresh - b.fresh);
  const use = new Set(m.slice(0, o.count).map(i => i.uid));

  const pay = o.reward * G.ledger;
  addMoney(pay);
  const xy = centerOf($('#tabBody'));
  popAt(xy[0], xy[1], '+' + money(pay), 'cash'); coinFly(xy, 12); Sfx.rankS();
  if (o.relic) grantRandomRelic(xy, pay);
  G.orders = G.orders.filter(x => x.id !== id); G.orders.push(genOrder());
  renderFridge(); renderTab(); refreshMarketRows();
}

function updateTable(dt) {

        }

function drawChart() {

  c.clearRect(0, 0, w, h);

  let lo = Math.min(1, ...hist), hi = Math.max(1, ...hist); const padv = (hi - lo) * .15 + .05; lo -= padv; hi += padv;
  const X = i => 4 + i / (BAL.marketHist - 1) * (w - 48), Y = v => h - 6 - (v - lo) / (hi - lo) * (h - 22);
  const off = BAL.marketHist - hist.length;

  // baseline
  c.strokeStyle = 'rgba(255,255,255,.25)'; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(0, Y(1)); c.lineTo(w - 44, Y(1)); c.stroke(); c.setLineDash([]);
  const last = hist[hist.length - 1]; const up = last >= hist[Math.max(0, hist.length - 6)];

  c.beginPath(); hist.forEach((v, i) => { const x = X(i + off), y = Y(v); i ? c.lineTo(x, y) : c.moveTo(x, y); });
  const lg = c.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, up ? 'rgba(166,255,61,.28)' : 'rgba(255,90,102,.28)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.lineTo(X(hist.length - 1 + off), h); c.lineTo(X(off), h); c.closePath(); c.fillStyle = lg; c.fill(); c.restore();
  c.beginPath(); hist.forEach((v, i) => { const x = X(i + off), y = Y(v); i ? c.lineTo(x, y) : c.moveTo(x, y); });
  c.strokeStyle = col; c.lineWidth = 2; c.shadowColor = col; c.shadowBlur = 8; c.stroke(); c.shadowBlur = 0;
  const lx = X(hist.length - 1 + off), ly = Y(last); c.fillStyle = col; c.beginPath(); c.arc(lx, ly, 3.5, 0, 6.28); c.fill();
  c.font = '800 11px JetBrains Mono,monospace'; c.fillStyle = col; c.textAlign = 'left'; c.fillText(fmtX(last), lx + 6, ly + 4);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.font = '9px JetBrains Mono,monospace'; c.fillText('×1', w - 40, Y(1) + 3);

}

// ---- receipt
function renderReceipt(r, total, count) {
  let h = '', i = 0;
  for (const ln of r.lines) {
    if (ln.kind !== 'base' && Math.abs(ln.v - 1) < 0.005) continue;
    if (i) h += `<span class="op" style="animation-delay:${i * 55}ms">×</span>`;
    h += `<span class="chip ${ln.kind}" style="animation-delay:${i * 55}ms">${ln.kind === 'base' ? money(ln.v) : ln.label + ' ' + fmtX(ln.v).slice(1)}</span>`; i++;
  }
  h += `<span class="op" style="animation-delay:${i * 55}ms">=</span><span class="total" style="animation-delay:${i * 55 + 60}ms">${money(total)}</span>`;
  if (count > 1) h += `<span class="cnt">(${count} ${G.lang === 'ja' ? '個' : 'items'})</span>`;
  $('#receipt').innerHTML = h;
}

/* ============================ 6. AUDIO ============================ */
const Sfx = {
  ctx: null, master: null, noise: null, creak: null, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = G.sound ? .45 : 0; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; this.noise = b;
    } catch (e) { this.ctx = null; }
  },
  setOn(on) { if (this.master) this.master.gain.value = on ? .45 : 0; },
  ok() { return this.ctx && G.sound; },
  thr(k, ms) { const n = performance.now(); if (this.last[k] && n - this.last[k] < ms) return false; this.last[k] = n; return true; },
  tone(f, dur, type = 'square', vol = .15, slide = null, delay = 0) {
    if (!this.ok()) return; const c = this.ctx, t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + .02);
  },
  nz(dur, vol, freq, q = 1, type = 'bandpass', delay = 0) {
    if (!this.ok()) return; const c = this.ctx, t0 = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noise; s.playbackRate.value = rand(.8, 1.2);
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0, Math.random() * .5); s.stop(t0 + dur + .02);
  },
  scrape() { if (this.thr('scrape', 45)) this.nz(.07, .09, rand(1400, 3200), 2.5); },
  crack(combo, armor) { const f = 260 + Math.min(combo, 60) * 18; this.tone(f, .06, 'triangle', .12, f * 1.6); this.nz(.05, armor ? .16 : .1, armor ? 4200 : 2200, 1, 'highpass'); },
  expose() { this.tone(880, .12, 'sine', .14, 1320); this.tone(1320, .15, 'sine', .08, null, .06); },
  pop() { this.tone(420, .2, 'sine', .25, 90); this.nz(.12, .2, 700, 1); },
  tear() { this.nz(.35, .35, 900, .7, 'lowpass'); this.tone(160, .35, 'sawtooth', .2, 50); },
  rankS() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'square', .07, null, i * .055)); this.pop(); },
  perfect() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone(f, .3, 'square', .07, null, i * .045)); this.tone(2093, .5, 'sine', .1, null, .28); this.pop(); },
  cash(sz) { if (!this.thr('cash', 40)) return; this.tone(1568, .05, 'square', .09); this.tone(2093, .22, 'square', .09, null, .05); if (sz > 1) [1047, 1319, 1568, 2093].forEach((f, i) => this.tone(f, .25, 'triangle', .1, null, .1 + i * .07)); },
  tick() { if (this.thr('tick', 30)) this.tone(2400 + rand(0, 600), .03, 'square', .03); },
  buy() { this.tone(660, .07, 'triangle', .18, 990); this.tone(990, .1, 'triangle', .14, 1480, .06); },
  relic() { [196, 247, 294, 392].forEach((f, i) => this.tone(f, .5, 'sawtooth', .05, null, i * .08)); },
  bad() { this.tone(150, .25, 'sawtooth', .15, 70); },
  news() { this.tone(988, .1, 'square', .12); this.tone(740, .18, 'square', .12, null, .12); this.tone(988, .1, 'square', .12, null, .32); },
  rumor() { this.tone(330, .25, 'sine', .1, 660); },
  thud() { this.tone(90, .25, 'sine', .35, 40); this.nz(.15, .15, 300, 1, 'lowpass'); },
  creakStart() { if (!this.ok() || this.creak) return; const c = this.ctx; const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = 70; f.type = 'bandpass'; f.frequency.value = 600; f.Q.value = 4; g.gain.value = 0; o.connect(f); f.connect(g); g.connect(this.master); o.start(); this.creak = { o, g, f }; },
  creakSet(stress, k) { if (!this.creak) return; const n = this.ctx.currentTime; this.creak.o.frequency.setTargetAtTime(60 + stress * 2.2 + k * 40, n, .03); this.creak.f.frequency.setTargetAtTime(400 + stress * 18, n, .03); this.creak.g.gain.setTargetAtTime(.04 + stress / 100 * .14, n, .03); },
  creakStop() { if (!this.creak) return; const { o, g } = this.creak; g.gain.setTargetAtTime(0, this.ctx.currentTime, .02); o.stop(this.ctx.currentTime + .1); this.creak = null; },
};

/* ============================ 7. INPUT / LOOP / SAVE ============================ */
function showGhost(item) {

  gh.querySelector('.gi').textContent = p.icon;
  const q = gh.querySelector('.gq'); q.textContent = item.perfect ? 'S★' : QUALITY[item.q].label; q.style.color = QUALITY[item.q].color;
  gh.querySelector('.gl').textContent = money(salePrice(item).total);
  gh.style.filter = item.variant !== 'normal' ? `drop-shadow(0 0 12px ${VARIANTS[item.variant].color}) drop-shadow(0 6px 10px #000)` : '';
  gh.style.display = 'block'; moveGhost();
}
function moveGhost() { const gh = $('#ghost'); gh.style.left = T.ptr.cx + 'px'; gh.style.top = T.ptr.cy + 'px'; }
function dropZoneAt(x, y) { const el = document.elementFromPoint(x, y); if (!el) return null; if (el.closest('#quickSell')) return 'quick'; if (el.closest('#fridgeZone')) return 'fridge'; return null; }
function dropHeld() {
  const item = T.held; T.held = null; $('#ghost').style.display = 'none';
  $('#quickSell').classList.remove('hot'); $('#fridgeZone').classList.remove('hot');
  const z = dropZoneAt(T.ptr.cx, T.ptr.cy); const xy = [T.ptr.cx, T.ptr.cy];
  if (z === 'quick') sellItems([item], { quick: true }, xy);
  else storeItem(item, xy);
}

function setupInput() {
  const cv = T.cv;
  const upd = e => { const r = cv.getBoundingClientRect(); T.ptr.x = e.clientX - r.left; T.ptr.y = e.clientY - r.top; T.ptr.cx = e.clientX; T.ptr.cy = e.clientY; T.ptr.inside = T.ptr.x >= 0 && T.ptr.y >= 0 && T.ptr.x <= r.width && T.ptr.y <= r.height; };
  cv.addEventListener('pointerdown', e => {
    Sfx.init(); upd(e); T.ptr.px = T.ptr.x; T.ptr.py = T.ptr.y; T.ptr.down = true; e.preventDefault();
    if (T.held) return;
    const hp = hoverPart(); if (hp) startPull(hp);
  });
  window.addEventListener('pointermove', e => {
    upd(e);
    if (T.held) { moveGhost(); const z = dropZoneAt(e.clientX, e.clientY); $('#quickSell').classList.toggle('hot', z === 'quick'); $('#fridgeZone').classList.toggle('hot', z === 'fridge'); }
    const tip = $('#tip'); if (tip.style.display === 'block') { tip.style.left = Math.min(innerWidth - 300, e.clientX + 14) + 'px'; tip.style.top = Math.min(innerHeight - tip.offsetHeight - 8, e.clientY + 14) + 'px'; }
  });
  window.addEventListener('pointerup', e => {
    upd(e); T.ptr.down = false;
    if (T.pull) cancelPull();
    if (T.held) dropHeld();
  });
  cv.addEventListener('pointerleave', () => { T.ptr.inside = false; });
  window.addEventListener('blur', () => { T.ptr.down = false; if (T.pull) cancelPull(); if (T.held) dropHeld(); });

  $('#haulBtn').addEventListener('click', () => { Sfx.init(); haulOut(); });
  $('#fridgeGrid').addEventListener('click', e => { const el = e.target.closest('.fitem'); if (!el) return; Sfx.init(); const it = G.fridge.find(i => i.uid === +el.dataset.uid); if (it) { hideTip(); sellItems([it], {}, centerOf(el)); } });
  $('#btnSort').addEventListener('click', () => { G.fridge.sort((a, b) => salePrice(b).total - salePrice(a).total); renderFridge(); });
  $('#btnSellRot').addEventListener('click', () => { Sfx.init(); sellItems(G.fridge.filter(i => i.fresh <= 0), {}, centerOf($('#fridgeZone'))); });
  $('#btnSellAll').addEventListener('click', () => { Sfx.init(); const by = {}; for (const it of G.fridge) (by[it.partId] = by[it.partId] || []).push(it); for (const k in by) sellItems(by[k], { bulk: by[k].length }, centerOf($('#fridgeZone'))); });
  $('#mktList').addEventListener('click', e => {
    const s = e.target.closest('[data-sell]');
    if (s) { Sfx.init(); const items = G.fridge.filter(i => i.partId === s.dataset.sell); sellItems(items, { bulk: items.length }, centerOf(s)); return; }
    const row = e.target.closest('.mrow'); if (row) { selPart = row.dataset.part; refreshMarketRows(); drawChart(); }
  });
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; curTab = b.dataset.tab; renderTab(); });
  $('#tabBody').addEventListener('click', e => {
    Sfx.init(); const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.up) buyUpgrade(b.dataset.up);
    else if (b.dataset.relic) buyRelic(b.dataset.relic);
    else if (b.dataset.rsell) sellRelic(b.dataset.rsell);
    else if (b.dataset.reroll) { const c = rerollPrice(); if (G.money < c) { Sfx.bad(); return; } G.money -= c; G.shop.rerolls++; rollShop(); Sfx.buy(); renderTab(); }
    else if (b.dataset.deliver) deliverOrder(+b.dataset.deliver);
    else if (b.dataset.odrop) { G.orders = G.orders.filter(o => o.id !== +b.dataset.odrop); G.orders.push(genOrder()); renderTab(); }
  });
  document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const h = tipHtml(el.dataset.tip); if (h) { const tip = $('#tip'); tip.innerHTML = h; tip.style.display = 'block'; } } else hideTip(); });
  $('#btnLang').addEventListener('click', () => { G.lang = G.lang === 'en' ? 'ja' : 'en'; applyLang(); });
  $('#btnSound').addEventListener('click', () => { G.sound = !G.sound; Sfx.init(); Sfx.setOn(G.sound); $('#btnSound').textContent = G.sound ? '🔊' : '🔇'; });
  $('#btnDev').addEventListener('click', () => $('#dev').classList.toggle('show'));
  $('#btnHelp').addEventListener('click', () => { renderHelp(); $('#help').classList.add('show'); });
  $('#help').addEventListener('click', () => $('#help').classList.remove('show'));
  $('#dev').addEventListener('click', e => {
    const k = e.target.dataset.dev; if (!k) return;
    if (k === 'money') { addMoney(Math.max(G.money * 9, 1000)); }
    if (k === 'dock' && (G.up.dock || 0) < 7) { G.up.dock = (G.up.dock || 0) + 1; recomputeStats(); buildMarketList(); T.forceNext = MONSTERS.find(m => m.dock === ST.dock).id; }
    if (k === 'news') { NEWS_RT.next = 0.01; if (!NEWS_RT.pending) NEWS_RT.pending = pickNews(); }
    if (k === 'variant') T.forceVariant = true;
    if (k === 'relic') grantRandomRelic(centerOf($('#relicSlots')), 0);
    if (k === 'fill') { const ups = unlockedParts(); while (G.fridge.length < ST.fridgeSlots) G.fridge.push(makeItem(pick(ups), 'normal', pick(['S', 'A', 'B']), false)); renderFridge(); refreshMarketRows(); }
    if (k.startsWith('ts')) timeScale = +k.slice(2);
    if (k === 'reset') { if (confirm('Wipe save and restart?')) { try { localStorage.removeItem(SAVE_KEY); } catch (_) { } G = defaultState(); wiped = true; location.reload(); } }
    renderToolStats(); renderTab(); renderRelicSlots();
  });
  window.addEventListener('resize', () => { resizeTable(); drawChart(); });
  window.addEventListener('keydown', e => { if (e.key === '`') $('#dev').classList.toggle('show'); if (e.key === ' ' && e.target === document.body) { e.preventDefault(); haulOut(); } });
}
function hideTip() { $('#tip').style.display = 'none'; }
function applyLang() {
  document.documentElement.lang = G.lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('#btnLang').textContent = G.lang === 'en' ? '日本語' : 'English';
  $('#btnHelp').textContent = G.lang === 'en' ? '? HOW TO' : '? 遊び方';
  renderMonTag(); renderToolStats(); buildMarketList(); renderTab(); updateTicker(); renderHelp();
}
function renderHelp() {
  const en = `<h2>HOW TO RUN A DUNGEON SCRAPYARD</h2><ol>
<li><b>Scrape:</b> hold the mouse and scrub across the monster to strip its plates. Faster strokes = more damage. Chain plate breaks for a <b>COMBO</b> (scrap cash ×).</li>
<li><b>Extract:</b> when a part glows, grab it and pull it out past the dotted ring. Watch the <b>SPEED</b> gauge: stay in the green. Yanking builds tendon stress → S / A / B / <span class="qX">TORN</span>. Pull steadily <i>and</i> quickly for <b>PERFECT</b>.</li>
<li><b>Don't nick:</b> scraping over an exposed part damages it before you even pull.</li>
<li><b>Store or Fence:</b> drop the part into <b>Cold Storage</b> (sell later) or the <b>Fence</b> (sell now). Organs rot fast; stones and bones keep.</li>
<li><b>Trade:</b> prices drift every tick. <b>Breaking news</b> can send a category ×2–×5 (or crash it). Hoard, wait, dump.</li>
<li><b>Inflate:</b> buy tools & facilities, unlock bigger monsters at the Loading Dock, equip <b>Dark Relics</b> whose effects multiply together. Fill the Codex for a global bonus. Guild Orders pay big and may give relics.</li></ol>
<p style="color:var(--mute)">Space = haul out · \` = dev/balance panel · progress autosaves locally. Click anywhere to close.</p>`;
  const ja = `<h2>ダンジョン解体屋の流儀</h2><ol>
<li><b>剥がす：</b>マウスを押したままモンスターの上をこすって外皮を剥がす。速くこするほど高ダメージ。連続破壊で<b>コンボ</b>（スクラップ収入↑）。</li>
<li><b>引き抜く：</b>光ったパーツを掴み、点線の円の外まで引き抜く。<b>速度ゲージ</b>を緑に保て。急ぐと腱ストレスが溜まり S / A / B / <span class="qX">千切れ</span> に。一定速度で素早く抜けば <b>PERFECT</b>。</li>
<li><b>傷に注意：</b>露出したパーツの上を削ると、抜く前から品質が落ちる。</li>
<li><b>保管か即売か：</b>パーツを<b>保管庫</b>（後で売る）か<b>故買屋</b>（今すぐ売る）へドロップ。臓器はすぐ腐る、石や骨は長持ち。</li>
<li><b>相場：</b>価格は常に変動。<b>速報ニュース</b>でカテゴリが×2〜×5に高騰（または暴落）。寝かせて、待って、売り抜けろ。</li>
<li><b>インフレ：</b>ツール・設備を強化し、搬入ライセンスで大型モンスターを解禁。<b>闇の遺物</b>の効果は掛け算で重なる。図鑑を埋めると全体ボーナス。ギルド依頼は高報酬＆遺物も。</li></ol>
<p style="color:var(--mute)">Space＝搬出 ・ \`＝開発／バランス調整パネル ・ 自動セーブ。クリックで閉じる。</p>`;
  $('#helpBox').innerHTML = G.lang === 'ja' ? ja : en;
}

let wiped = false;
function save() { if (wiped) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (_) { } }
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const d = JSON.parse(raw); const def = defaultState(); G = Object.assign(def, d); G.stats = Object.assign(def.stats, d.stats || {}); G.shop = Object.assign(def.shop, d.shop || {}); return true; } } catch (_) { }
  return false;
}

let last = performance.now(), uiT = 0, slowT = 0, mktT = 0, saveT = 0, dispMoney = 0;
function frame(now) {
  const rawDt = Math.min(0.05, (now - last) / 1000); last = now; const dt = rawDt * timeScale;
  updateTable(rawDt);            // table always real-time for feel
  updateFreshness(dt);
  updateNews(dt);
  updateOrders(dt);
  if (T.hurtT > 0) T.hurtT -= rawDt;
  mktT += dt; if (mktT >= BAL.marketTick) { mktT -= BAL.marketTick; tickMarket(); }
  renderTable();
  // header (every frame, cheap)
  dispMoney = dispMoney + (G.money - dispMoney) * Math.min(1, rawDt * 12); if (Math.abs(G.money - dispMoney) < .01) dispMoney = G.money;
  setText('#hMoney', money(dispMoney));
  uiT += rawDt; if (uiT > .2) {
    uiT = 0; renderHud(); refreshAfford(); renderActiveNews();
    const n = performance.now(); while (incomeLog.length && n - incomeLog[0][0] > 60000) incomeLog.shift();
    setText('#hPerMin', money(incomeLog.reduce((a, b) => a + b[1], 0))); setText('#hLife', money(G.lifetime)); setText('#hGlobal', fmtX(globalMult()));
    $('#mktClock').textContent = new Date().toLocaleTimeString();
    $('#devInfo').textContent = `sales ${G.sales} · S ${G.stats.sCount} · perf ${G.stats.perfect} · broke ${G.stats.broken} · bodies ${G.stats.monsters} · ledger ${fmtX(G.ledger)}`;
  }
  slowT += rawDt; if (slowT > .5) { slowT = 0; refreshFridgePrices(); if (tabsDirty && curTab === 'orders') renderTab(); if (curTab === 'orders') document.querySelectorAll('#tabBody .otime').forEach((el, i) => { const o = G.orders[i]; if (o) el.style.width = (o.t / o.max * 100) + '%'; }); }
  saveT += rawDt; if (saveT > BAL.autosaveSec) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
function setText(sel, v) { const el = $(sel); if (el.textContent !== v) el.textContent = v; }

function boot() {
  load(); recomputeStats(); initMarket();
  if (!G.orders.length) for (let i = 0; i < BAL.orderCount; i++) G.orders.push(genOrder());
  if (!G.shop.offers.length) rollShop();
  dispMoney = G.money;
  T.cv = $('#tableCv'); T.ctx = T.cv.getContext('2d');
  resizeTable(); setupInput(); applyLang();
  $('#btnSound').textContent = G.sound ? '🔊' : '🔇';
  renderRelicSlots(); renderFridge(); renderToolStats();
  spawnMonster();
  if (!G.lifetime) setTimeout(() => { renderHelp(); $('#help').classList.add('show'); }, 300);
  window.addEventListener('beforeunload', save);
  requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
}
boot();
</script>
</body>
</html>
