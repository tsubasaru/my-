<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--HEAD-->
<title>ともしびの旅路</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: one-screen game — pixel canvas stage on top, touch pad below; all UI windows scale with --u (one logical pixel) */
:root{
  --page:#0e0c1c; --win:#1b1836; --win-edge:#0a0816; --frame:#f2d9a0; --ink:#fff6e0;
  --accent:#ffb347; --dim:#9c93b8; --pad:#2a2548; --pad-hi:#3d3768;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",monospace;
  --u:2px; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#stage{position:relative;flex:none;width:calc(var(--u)*240);height:calc(var(--u)*192);font-size:calc(var(--u)*10);
  background:#000;overflow:hidden;border-radius:calc(var(--u)*2)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.win{position:absolute;box-sizing:border-box;background:var(--win);color:var(--ink);
  border:calc(var(--u)*1.5) solid var(--frame);border-radius:calc(var(--u)*3);box-shadow:0 0 0 calc(var(--u)*1) var(--win-edge)}
#msg{left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*3);min-height:calc(var(--u)*54);
  padding:calc(var(--u)*4) calc(var(--u)*7);line-height:1.45;white-space:pre-wrap}
#msgArrow{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*1);color:var(--accent);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-2))}}
#menu{right:calc(var(--u)*3);bottom:calc(var(--u)*60);display:grid;grid-template-columns:repeat(var(--cols,1),auto);
  max-height:calc(var(--u)*124);overflow-y:auto;padding:calc(var(--u)*2)}
#menu.inmsg{bottom:calc(var(--u)*3)}
.opt{position:relative;font:inherit;color:inherit;background:none;border:0;text-align:left;white-space:nowrap;cursor:pointer;
  padding:calc(var(--u)*2.2) calc(var(--u)*6) calc(var(--u)*2.2) calc(var(--u)*12)}
.opt.cur{color:var(--accent)}
.opt.cur::before{content:"▶";position:absolute;left:calc(var(--u)*2.5);font-size:.8em;top:50%;transform:translateY(-50%)}
.opt.dis{color:var(--dim)}
.opt:focus{outline:none}
#hud{left:calc(var(--u)*3);top:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*5);line-height:1.35;
  white-space:pre;font-variant-numeric:tabular-nums}
#chip{right:calc(var(--u)*3);top:calc(var(--u)*3);padding:calc(var(--u)*1) calc(var(--u)*4);font-size:.85em;
  border-width:calc(var(--u)*1);font-variant-numeric:tabular-nums}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
#title h1{margin:calc(var(--u)*30) 0 0;font-size:2.4em;font-weight:400;letter-spacing:.12em;color:var(--frame);
  text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #6b3a1a, 0 0 calc(var(--u)*10) rgba(255,179,71,.7)}
#title p{margin:calc(var(--u)*4) 0 0;font-size:.9em;color:var(--ink);text-shadow:0 calc(var(--u)*1) 0 #000}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s linear}
#pad{flex:none;width:min(100%,calc(var(--u)*240));min-width:min(100%,300px);height:var(--padh,150px);display:flex;align-items:center;justify-content:space-between;gap:8px}
#dpad{position:relative;width:calc(var(--padh,150px)*.86);height:calc(var(--padh,150px)*.86);border-radius:50%;background:var(--pad);
  box-shadow:inset 0 0 0 3px var(--pad-hi);touch-action:none;cursor:pointer}
#dpad i{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.75}
#dpad i.u{left:50%;top:10%;margin-left:-9px;border-bottom-color:var(--ink);border-top:0}
#dpad i.d{left:50%;bottom:10%;margin-left:-9px;border-top-color:var(--ink);border-bottom:0}
#dpad i.l{top:50%;left:10%;margin-top:-9px;border-right-color:var(--ink);border-left:0}
#dpad i.r{top:50%;right:10%;margin-top:-9px;border-left-color:var(--ink);border-right:0}
#dpad i.on{opacity:1;filter:drop-shadow(0 0 4px var(--accent))}
#mid{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
#snd{white-space:nowrap;font:inherit;font-size:12px;color:var(--ink);background:var(--pad);border:2px solid var(--pad-hi);border-radius:999px;padding:5px 12px;cursor:pointer}
#btns{display:flex;gap:10px;align-items:flex-end}
.rb{font:inherit;color:var(--ink);border:0;border-radius:50%;cursor:pointer;touch-action:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
.rb small{font-size:10px;opacity:.85}
#bA{width:calc(var(--padh,150px)*.5);height:calc(var(--padh,150px)*.5);background:#c9603a;font-size:20px;margin-bottom:calc(var(--padh,150px)*.2)}
#bB{width:calc(var(--padh,150px)*.4);height:calc(var(--padh,150px)*.4);background:#4a5a9a;font-size:16px}
.rb:active,.rb.on{filter:brightness(1.35)}
#snd:focus-visible,.rb:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover) and (pointer:fine){#mid .kb{display:block}}
#mid .kb{display:none}
@media (prefers-reduced-motion:reduce){#msgArrow{animation:none}#fade{transition:none}}
</style>
<!--/HEAD-->
</head>
<body>
<!--BODY-->
<div id="app">
  <div id="stage">
    <canvas id="cv" width="240" height="192"></canvas>
    <div id="title"><h1>ともしびの旅路</h1><p>第1章　ヒダマリ村と コモレビの森</p></div>
    <div id="hud" class="win" hidden></div>
    <div id="chip" class="win" hidden></div>
    <div id="msg" class="win" hidden><span id="msgText"></span><span id="msgArrow" hidden>▼</span></div>
    <div id="menu" class="win" hidden></div>
    <div id="fade"></div>
  </div>
  <div id="pad">
    <div id="dpad" aria-label="いどう"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <div id="mid">
      <button id="snd" type="button">♪ おと ON</button>
      <span class="kb">矢印/WASD:いどう<br>Z/Enter:けってい<br>X/Esc:メニュー</span>
    </div>
    <div id="btns">
      <button id="bB" class="rb" type="button">B<small>メニュー</small></button>
      <button id="bA" class="rb" type="button">A<small>けってい</small></button>
    </div>
  </div>
</div>
<script>
"use strict";
/* ===================== 基本 ===================== */
const $=id=>document.getElementById(id);
const TS=16,VW=240,VH=192;
const cv=$('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};

/* ===================== ドット絵生成 ===================== */
class Grid{
  constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null)}
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c}
  get(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h?this.d[y*this.w+x]:null}
  fill(c){this.d.fill(c)}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c)}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c)}}
  tri(ax,ay,bx,by,cx,cy,c){const mnx=Math.floor(Math.min(ax,bx,cx)),mxx=Math.ceil(Math.max(ax,bx,cx)),mny=Math.floor(Math.min(ay,by,cy)),mxy=Math.ceil(Math.max(ay,by,cy));
    const s=(px,py,qx,qy,rx,ry)=>(px-rx)*(qy-ry)-(qx-rx)*(py-ry);
    for(let y=mny;y<=mxy;y++)for(let x=mnx;x<=mxx;x++){const px=x+.5,py=y+.5,d1=s(px,py,ax,ay,bx,by),d2=s(px,py,bx,by,cx,cy),d3=s(px,py,cx,cy,ax,ay);
      if(!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0)))this.set(x,y,c)}}
  line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
    for(;;){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
  outline(c){const o=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(o[y*this.w+x])continue;
    const n=(i,j)=>{const xx=x+i,yy=y+j;return xx>=0&&yy>=0&&xx<this.w&&yy<this.h&&o[yy*this.w+xx]};
    if(n(1,0)||n(-1,0)||n(0,1)||n(0,-1))this.d[y*this.w+x]=c}return this}
  flip(){const g=new Grid(this.w,this.h);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)g.d[y*this.w+x]=this.d[y*this.w+this.w-1-x];return g}
  canvas(){const c=document.createElement('canvas');c.width=this.w;c.height=this.h;const x=c.getContext('2d');
    for(let i=0;i<this.d.length;i++)if(this.d[i]){x.fillStyle=this.d[i];x.fillRect(i%this.w,Math.floor(i/this.w),1,1)}return c}
}
const DK='#2a2030';
function tile(fn,seed){const g=new Grid(16,16);fn(g,rng(seed||7));return g.canvas()}
function speck(g,r,n,cols){for(let i=0;i<n;i++)g.set(r()*16,r()*16,cols[Math.floor(r()*cols.length)])}
const TIL={};
function buildTiles(){
  TIL.grass=tile((g,r)=>{g.fill('#62b450');speck(g,r,16,['#55a546','#72c35e']);for(let i=0;i<3;i++){const x=1+r()*13,y=2+r()*12;g.set(x,y,'#4a9a3e');g.set(x+1,y-1,'#4a9a3e')}},11);
  TIL.path=tile((g,r)=>{g.fill('#dcc088');speck(g,r,22,['#c9a970','#e9d4a6','#c9a970'])},12);
  TIL.water=[0,1].map(f=>tile((g,r)=>{g.fill('#3f86d9');for(let i=0;i<5;i++){const x=Math.floor(r()*12+f*3)%14,y=1+Math.floor(r()*14);g.rect(x,y,3,1,'#86bdf2');g.set(x+3,y+1,'#86bdf2')}speck(g,r,6,['#3577c6'])},13));
  TIL.bridge=tile(g=>{g.fill('#c0935a');for(let y=3;y<16;y+=4)g.rect(0,y,16,1,'#8a6238');g.rect(0,0,2,16,'#7a5230');g.rect(14,0,2,16,'#7a5230');g.rect(2,0,1,16,'#d9b272')});
  const wall=g=>{g.fill('#eadfc4');for(let y=3;y<16;y+=4){g.rect(0,y,16,1,'#cfc09c');for(let x=(y%8===3?3:7);x<16;x+=8)g.rect(x,y-3,1,3,'#cfc09c')}g.rect(0,14,16,2,'#b9a67e')};
  TIL.wall=tile(wall);
  const win=col=>tile(g=>{wall(g);g.rect(3,3,10,9,'#5b4a3a');g.rect(4,4,8,7,col);g.rect(7,4,2,7,'#5b4a3a');g.rect(4,7,8,1,'#5b4a3a')});
  TIL.wallwin=win('#9ad6ff');TIL.wallwinN=win('#ffd96a');
  TIL.roof=tile(g=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){const o=(Math.floor(y/4)%2)*4;g.set(x,y,(y%4===3||(x+o)%8===0)?'#9e3f30':(y%4===0?'#d8715a':'#c2553f'))}});
  TIL.door=tile(g=>{wall(g);g.rect(3,1,10,15,'#5a3a1a');g.rect(4,2,8,14,'#9a6a3a');g.rect(7,2,1,14,'#7a5230');g.rect(10,9,1,2,'#ffd96a')});
  TIL.iwall=tile(g=>{g.fill('#786c8c');for(let y=3;y<10;y+=4){g.rect(0,y,16,1,'#5f5474');for(let x=(y===3?4:8);x<16;x+=8)g.rect(x,y-3,1,3,'#5f5474')}g.rect(0,10,16,6,'#463c56');g.rect(0,10,16,1,'#2f2740')});
  TIL.floor=tile(g=>{g.fill('#c99b63');for(let y=3;y<16;y+=4){g.rect(0,y,16,1,'#a97f4b');g.rect((y*3)%13,y-3,1,3,'#a97f4b')}});
  TIL.rug=tile(g=>{g.fill('#b5484a');for(let y=1;y<16;y+=4)for(let x=1;x<16;x+=4)g.set(x+(y%8===1?0:2),y,'#e6c06a')});
  TIL.exit=tile(g=>{g.fill('#c99b63');g.rect(2,2,12,9,'#e6c06a');g.rect(3,3,10,7,'#b5484a');g.rect(0,12,16,4,'#1a1420')});
  TIL.void=tile(g=>g.fill('#0e0c1c'));
  // overlays
  TIL.flower=tile(g=>{[[4,4,'#ffffff'],[11,8,'#ffc4d8'],[5,12,'#ffe27a']].forEach(([x,y,c])=>{g.set(x-1,y,c);g.set(x+1,y,c);g.set(x,y-1,c);g.set(x,y+1,c);g.set(x,y,'#f29a2e')})});
  TIL.tall=tile((g,r)=>{[1,4,7,10,13].forEach(x=>{const h=5+r()*4;g.line(x,15,x,15-h,'#2f8a34');g.line(x+1,15,x+2,15-h+1,'#48ad4a');g.set(x+2,15-h,'#8fdc6e')})},21);
  TIL.tree=tile((g,r)=>{g.rect(7,11,2,5,'#7a5230');g.set(6,15,'#7a5230');g.set(9,15,'#7a5230');
    const c=new Grid(16,16);c.ell(8,6.5,7.5,6.5,'#2f7d3a');for(let y=9;y<14;y++)for(let x=0;x<16;x++)if(c.get(x,y))c.set(x,y,'#27692f');
    c.ell(6,4.5,3.5,2.8,'#46a04e');for(let i=0;i<7;i++){const x=2+r()*12,y=1+r()*9;if(c.get(x,y))c.set(x,y,'#6cc56a')}
    for(let i=0;i<256;i++)if(c.d[i])g.d[i]=c.d[i];g.outline('#173d20')},22);
  TIL.fence=tile(g=>{g.rect(0,6,16,2,'#b08850');g.rect(0,10,16,2,'#b08850');[1,7,13].forEach(x=>g.rect(x,4,2,10,'#d0aa72'));g.outline('#5a4026')});
  TIL.well=tile(g=>{g.ell(8,9,7,6,'#a2a2b2');g.ell(8,8,5,4,'#27406e');g.set(6,7,'#6f9be0');g.set(9,9,'#6f9be0');g.set(3,12,'#7c7c8c');g.set(12,11,'#7c7c8c');g.outline('#3a3a48')});
  TIL.barrel=tile(g=>{g.ell(8,9,5,6,'#a8703c');g.rect(3,7,10,1,'#5a4630');g.rect(3,12,10,1,'#5a4630');g.ell(8,4.5,4.5,2,'#c98d52');g.outline(DK)});
  TIL.sign=tile(g=>{g.rect(7,9,2,6,'#7a5230');g.rect(2,2,12,7,'#d9b272');g.rect(4,4,8,1,'#7a5230');g.rect(4,6,6,1,'#7a5230');g.outline(DK)});
  TIL.rock=tile(g=>{g.ell(8,10,6,4.5,'#9498a6');g.ell(6,8.5,3,2,'#b9bdcb');g.outline('#3a3a48')});
  TIL.stump=tile(g=>{g.ell(8,11,5,4,'#8a6238');g.ell(8,8,5,2.5,'#d9b98a');g.ell(8,8,2.5,1.2,'#b9935e');g.outline(DK)});
  TIL.shroom=tile(g=>{g.rect(7,10,2,4,'#f3e6c8');g.ell(8,8,4,3,'#e2748a');g.set(6,7,'#fff');g.set(9,8,'#fff');g.outline(DK)});
  TIL.counter=tile(g=>{g.rect(0,4,16,10,'#8a5a32');g.rect(0,2,16,4,'#c08a52');g.rect(0,6,16,1,'#5a3a1a');g.rect(0,14,16,1,'#5a3a1a')});
  TIL.bed=tile(g=>{g.rect(2,1,12,14,'#f4f0e6');g.rect(4,2,8,3,'#ffffff');g.rect(2,6,12,9,'#5b8fd6');g.rect(2,6,12,1,'#86b4ef');g.outline(DK)});
  TIL.table=tile(g=>{g.rect(4,10,2,5,'#7a5230');g.rect(10,10,2,5,'#7a5230');g.ell(8,8,6.5,4.5,'#b9804a');g.ell(8,7,5.5,3.2,'#d9a066');g.outline(DK)});
  TIL.statue=[0,1].map(f=>tile(g=>{g.rect(3,13,10,2,'#8a8a9c');g.rect(5,7,6,6,'#a9a9ba');g.rect(6,8,1,4,'#c9c9d6');g.rect(4,5,8,2,'#c9c9d6');
    g.tri(8-f,0,5,5,11,5,'#ff9a3c');g.rect(7,3,2,2,'#ffe27a');g.outline(DK)}));
  TIL.fire=[0,1].map(f=>tile(g=>{g.line(3,14,13,11,'#7a5230');g.line(3,11,13,14,'#7a5230');g.ell(8,8+f,3.5,4.5-f,'#ff8a3c');g.tri(8+f,1,6,7,10,7,'#ff8a3c');g.ell(8,9,2,3,'#ffd96a');g.outline(DK)}));
  TIL.chest=tile(g=>{g.rect(2,5,12,9,'#b9772f');g.rect(2,5,12,4,'#dba04a');g.rect(2,8,12,1,'#5a3a1a');g.rect(7,8,2,3,'#ffd96a');g.outline(DK)});
  TIL.chestOpen=tile(g=>{g.rect(2,8,12,6,'#b9772f');g.rect(3,5,10,3,'#2a1a10');g.rect(2,2,12,3,'#dba04a');g.outline(DK)});
  TIL.herb=[0,1].map(f=>tile(g=>{g.line(8,14,8,7,'#3f8a3a');g.ell(5,11,2.5,1.2,'#5fbf4f');g.ell(11,10,2.5,1.2,'#5fbf4f');g.ell(8,5,3,3,'#bfe8ff');g.ell(8,5,1.3,1.3,'#ffffff');g.outline('#2a4a6a');
    if(f){g.set(2,3,'#fff');g.set(13,6,'#fff')}else{g.set(3,7,'#fff');g.set(12,2,'#fff')}}));
}
/* キャラクター */
const CH={
  hero:{hair:'#8a4a2a',shirt:'#3f6fd6',pants:'#5a4630',scarf:'#e2483c'},
  elder:{hair:'#e8e8f0',shirt:'#7a4a9a',pants:'#4a3a5a',beard:1},
  woman:{hair:'#d9a03a',shirt:'#e2748a',pants:'#b5484a',long:1},
  kid:{hair:'#3a2a20',shirt:'#5fbf4f',pants:'#3f6fd6'},
  guard:{hair:'#5a3a1a',hat:'#aab4c4',shirt:'#b9463c',pants:'#5a5a6a'},
  shopw:{hair:'#5a3a1a',shirt:'#d98a2f',pants:'#5a4630',beard:1},
  shopi:{hair:'#b5484a',shirt:'#3f9a8a',pants:'#4a3a5a',long:1},

}

    if(Math.hypot(dx,dy)>r.width*.12)d=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');

function bgm(name){if(name===bgmName)return;clearInterval(bgmTimer);if(bgmNode){try{bgmNode.gain.value=0;bgmNode.disconnect()}catch(e){}bgmNode=null}

async function battle(ids,opt={}){

    boss:!!opt.boss,shake:0,cursor:-1,night:isNight(),def:false,t:0};

  let result=null;
  while(!result){
    B.def=false;const act=await command();
    if(act.type==='run'){if(B.boss){await bsay('しかし にげられない！')}else if(Math.random()<.65){sfx('run');await bsay(`${S.name}は にげだした！`);result='run';break}else await bsay('しかし まわりこまれた！')}
    const order=[];if(act.type!=='run')order.push({k:'hero',s:S.spd+Math.random()*4+(act.type==='def'?99:0)});
    if(S.pal)order.push({k:'pal',s:MON[S.pal].spd+Math.random()*4});
    alive().forEach(e=>order.push({k:'en',e,s:e.m.spd+Math.random()*4}));order.sort((a,b)=>b.s-a.s);
    for(const o of order){
      if(S.hp<=0){result='lose';break}if(!alive().length){result='win';break}
      if(o.k==='hero')await heroAct(act);else if(o.k==='pal')await palAct();else if(!o.e.dead)await enemyAct(o.e);
    }
    if(!result){if(S.hp<=0)result='lose';else if(!alive().length)result='win'}
  }
  if(result==='win')await victory();
  if(result==='lose'){bgm(null);await say(`${S.name}は ちからつきた…`);await fade(1);S.gold=Math.floor(S.gold/2);S.hp=S.mhp;S.mp=S.mmp;S.time=10;
    mode='map';showHud(false);hideMsg();B=null;setMap('inn',7,2,'down');await fade(0);

    else if(c===1){const sk=SKILLS.filter(s=>S.lv>=s.lv);if(!sk.length){await bsay('まだ とくぎを おぼえていない。');continue}

      const s=sk[i];if(s.target){const t=await target();if(t)return {type:'skill',s,t}}else return {type:'skill',s}}
    else if(c===2)return {type:'def'};
    else if(c===3){const id=await itemMenu(true);if(!id)continue;if(id==='nut'){const t=await target();if(t)return {type:'item',id,t}}else return {type:'item',id}}

async function target(){const a=alive();if(a.length===1)return a[0];setMsg('だれを ねらう？');

async function hitEnemy(e,d,note){e.hp-=d;e.flash=16;sfx('hit');await bsay(`${note||''}${e.name}に ${d}の ダメージ！`,560);
  if(e.hp<=0){e.dead=true;sfx('down');await bsay(`${e.name}を たおした！`,520)}}
async function magicHit(e,base){let d=Math.round(base*vary()),note='';if(e.m.weak){d=Math.round(d*1.5);note='こうかは ばつぐん！\n'}if(e.m.resist){d=Math.max(1,Math.round(d*.5));note='あまり きいていない…\n'}
  sfx('fire');e.flash=16;await sleep(180);await hitEnemy(e,d,note)}
async function heroAct(a){
  if(a.t&&a.t.dead){a.t=alive()[0];if(!a.t)return}
  if(a.type==='atk'){await bsay(`${S.name}の こうげき！`,380);if(a.t.m.dodge&&Math.random()<a.t.m.dodge){await bsay(`${a.t.name}は ひらりと かわした！`);return}
    const crit=Math.random()<1/14;let d=dmgCalc(atkT(),crit?0:a.t.m.def);if(crit)d=Math.round(d*1.6);await hitEnemy(a.t,d,crit?'かいしんの いちげき！\n':'')}
  else if(a.type==='def'){B.def=true;await bsay(`${S.name}は みをまもっている。`,500)}
  else if(a.type==='skill'){const s=a.s;if(S.mp<s.mp){await bsay('MPが たりない！');return}S.mp-=s.mp;updateHud();await bsay(`${S.name}は ${s.n}を となえた！`,420);
    if(s.id==='fire')await magicHit(a.t,13+S.lv*2);
    else if(s.id==='blaze')await magicHit(a.t,30+S.lv*3);
    else if(s.id==='heal'){const v=Math.min(S.mhp-S.hp,22+S.lv*3+rnd(7));S.hp+=v;sfx('heal');updateHud();await bsay(`HPが ${v} かいふくした！`)}
    else if(s.id==='spin'){for(const e of alive())await hitEnemy(e,Math.max(1,Math.round(dmgCalc(atkT(),e.m.def)*.8)))}}
  else if(a.type==='item'){give(a.id,-1);
    if(a.id==='herb'){const v=Math.min(S.mhp-S.hp,28+rnd(8));S.hp+=v;sfx('heal');updateHud();await bsay(`${S.name}は やくそうを つかった！\nHPが ${v} かいふくした！`,800)}
    else if(a.id==='water'){const v=Math.min(S.mmp-S.mp,15);S.mp+=v;sfx('heal');updateHud();await bsay(`${S.name}は まほうの水を のんだ！\nMPが ${v} かいふくした！`,800)}
    else if(a.id==='nut'){await bsay(`${S.name}は きのみを さしだした！`,500);
      if(B.boss)await bsay(`${a.t.name}は 見むきもしない！`);else{a.t.tamed=true;sfx('heal');await bsay(`${a.t.name}は うれしそうに\nきのみを ほおばっている！`,850)}}}
}
async function palAct(){const m=MON[S.pal],p=m.pal,n=m.n,a=alive();if(!a.length)return;const e=pick(a),pow=p.atk+S.lv*1.5;
  if(p.type==='heal'&&S.hp<S.mhp*.6&&Math.random()<.6){const v=Math.min(S.mhp-S.hp,7+S.lv*2);S.hp+=v;sfx('heal');updateHud();await bsay(`${n}が ふわふわと よりそった！\n${S.name}のHPが ${v} かいふく！`,800);return}
  if(p.type==='spore'&&!e.stun&&Math.random()<.3){e.stun=true;await bsay(`${n}が ほうしを まいた！\n${e.name}は しびれて うごけない！`,850);return}
  if(p.type==='fire'){await bsay(`${n}の あおい ほのお！`,380);await magicHit(e,8+S.lv*2);return}

  if(p.type==='twice'&&!e.dead&&Math.random()<.45){await bsay(`${n}は もういちど とびかかった！`,380);await hitEnemy(e,dmgCalc(pow,e.m.def))}
}
async function hurtHero(d){if(B.def)d=Math.max(1,Math.round(d/2));S.hp=Math.max(0,S.hp-d);B.shake=12;sfx('hurt');updateHud();await bsay(`${S.name}は ${d}の ダメージを うけた！`,600)}
async function enemyAct(e){
  if(e.stun){e.stun=false;await bsay(`${e.name}は しびれて うごけない！`,500);return}
  if(e.tamed&&Math.random()<.4){await bsay(`${e.name}は きのみに むちゅうだ。`,500);return}
  const ai=e.m.ai;
  if(e.charged){e.charged=false;await bsay(ai==='boss'?`${e.name}の だいしぜんの いちげき！`:`${e.name}の ちからいっぱいの こうげき！`,450);await hurtHero(Math.round(dmgCalc(e.m.atk,defT())*(ai==='boss'?2.1:1.8)));return}
  if((ai==='charge'&&Math.random()<.25)||(ai==='boss'&&Math.random()<.3)){e.charged=true;await bsay(`${e.name}は ちからを ためている…！`,700);return}
  if(ai==='fire'&&Math.random()<.5){sfx('fire');await bsay(`${e.name}は あおい炎を はなった！`,450);await hurtHero(9+rnd(5));return}
  await bsay(`${e.name}の こうげき！`,380);
  if(Math.random()<.06){await bsay(`${S.name}は ひらりと みをかわした！`);return}
  await hurtHero(dmgCalc(e.m.atk,defT()));
}
async function victory(){
  bgm(null);sfx('win');let exp=0,gold=0;B.en.forEach(e=>{exp+=e.m.exp;gold+=e.m.gold});
  if(B.night&&!B.boss)gold=Math.round(gold*1.5);
  S.exp+=exp;S.gold+=gold;
  await say(`まものの むれを やっつけた！\n${exp}の けいけんちと ${gold}ゴールドを てにいれた！${B.night&&!B.boss?'\n(よるの まものは お金を 多く もっている)':''}`);
  while(S.exp>=expNeed(S.lv)){S.lv++;const h=5+rnd(4),m=2+rnd(3);S.mhp+=h;S.mmp+=m;S.atk+=2;S.def+=1+rnd(2);S.spd+=1;S.hp=Math.min(S.mhp,S.hp+h);S.mp=Math.min(S.mmp,S.mp+m);
    sfx('lvup');updateHud();await say(`${S.name}は レベル${S.lv}に あがった！\nさいだいHP +${h}　さいだいMP +${m}\nちから・まもり・はやさが あがった！`);
    const ns=SKILLS.find(s=>s.lv===S.lv);if(ns)await say(`とくぎ「${ns.n}」を おぼえた！\n${ns.d}。`)}
  if(!B.boss){
    if(Math.random()<.12){await getItem('herb')}
    const tamed=B.en.filter(e=>e.tamed);let cand=null;
    if(tamed.length&&Math.random()<.7)cand=pick(tamed);else if(Math.random()<.05)cand=B.en[B.en.length-1];
    if(cand&&cand.id!==S.pal){sfx('heal');await say(`なんと ${cand.m.n}が おきあがり\nなかまに なりたそうに こちらを 見ている！`);
      setMsg(S.pal?`${MON[S.pal].n}と いれかえて\nなかまに しますか？`:'なかまに しますか？');
      if(await yesNo()){if(S.pal)await say(`${MON[S.pal].n}は 手をふって 森へ かえっていった。`);S.pal=cand.id;updateHud();sfx('lvup');await say(`${cand.m.n}が なかまに なった！\n${cand.m.info}。`)}
      else await say(`${cand.m.n}は さみしそうに さっていった…`)}
  }
}

function npc(map,x,y,spr,talkFn,o={}){MAPS[map].npcs.push(Object.assign({x,y,hx:x,hy:y,px:x*TS,py:y*TS,spr,dir:'down',talk:talkFn,moving:false,wait:1+Math.random()*3,anim:0},o))}
async function shop(kind){
  for(;;){
    let list;
    if(kind==='w')list=[...WEAPONS.map((w,i)=>({t:'w',i,n:w.n,price:w.price,d:`ちから +${w.v}`})),...ARMORS.map((w,i)=>({t:'a',i,n:w.n,price:w.price,d:`まもり +${w.v}`}))].filter(x=>x.price);
    else list=['herb','water','nut','bell'].map(id=>({t:'i',id,n:ITEMS[id].n,price:ITEMS[id].price,d:ITEMS[id].d}));
    const i=await choose([...list.map(x=>`${x.n} ${x.price}G`),'やめる'],{onFocus:i=>setMsg(i<list.length?`${list[i].d}\n(もちがね ${S.gold}G)`:'またどうぞ。')});
    if(i<0||i>=list.length)return;const it=list[i];
    if(it.t==='w'&&S.weapon>=it.i||it.t==='a'&&S.armor>=it.i){await say('それより いいものを もう もっているね。');continue}
    if(S.gold<it.price){sfx('ng');await say('お金が たりないようだね。');continue}
    S.gold-=it.price;sfx('chest');
    if(it.t==='w'){S.weapon=it.i;await say(`${it.n}を かって そうびした！`)}
    else if(it.t==='a'){S.armor=it.i;await say(`${it.n}を かって そうびした！`)}
    else{give(it.id);await say(`${it.n}を かった！`)}
  }
}

    S.flags.herb=1;give('moon');S.quest=Math.max(S.quest,2);sfx('lvup');await talk('あわく光る 草を そっと つみとった。\nつきしずく草を てにいれた！','はやく 村長の ところへ とどけよう。')};
  herb.solid=true;F.things['33,34']=herb;
}

/* ===================== 更新と描画 ===================== */
function update(dt){
  if(mode!=='map')return;
  if(H.moving){const sp=84*dt,tx=H.tx*TS,ty=H.ty*TS;H.anim+=dt;
    H.px+=Math.sign(tx-H.px)*Math.min(sp,Math.abs(tx-H.px));H.py+=Math.sign(ty-H.py)*Math.min(sp,Math.abs(ty-H.py));
    if(H.px===tx&&H.py===ty){H.x=H.tx;H.y=H.ty;H.moving=false;onStep()}}
  if(!H.moving&&!busy&&!keyHandler&&heldOrder.length)tryMove(heldOrder[heldOrder.length-1]);
  if(!H.moving)H.anim=0;
  for(const n of npcsNow()){
    if(n.moving){const sp=36*dt,tx=n.tx*TS,ty=n.ty*TS;n.anim+=dt;n.px+=Math.sign(tx-n.px)*Math.min(sp,Math.abs(tx-n.px));n.py+=Math.sign(ty-n.py)*Math.min(sp,Math.abs(ty-n.py));
      if(n.px===tx&&n.py===ty){n.x=n.tx;n.y=n.ty;n.moving=false;n.anim=0}}
    else if(n.wander&&!busy){n.wait-=dt;if(n.wait<=0){n.wait=1.5+Math.random()*3;if(n.spr==='cat'&&isNight())continue;const d=pick(Object.keys(DIRS)),nx=n.x+DIRS[d][0],ny=n.y+DIRS[d][1];n.dir=d;
      if(Math.abs(nx-n.hx)<=n.wander&&Math.abs(ny-n.hy)<=n.wander&&!solid(nx,ny)&&!npcAt(nx,ny)&&!(nx===H.x&&ny===H.y)&&!(H.moving&&nx===H.tx&&ny===H.ty)&&!cur.warps[nx+','+ny]&&'p.,Fr'.includes(tileAt(nx,ny))){n.moving=true;n.tx=nx;n.ty=ny}}}
  }
}
const dark=document.createElement('canvas');dark.width=VW;dark.height=VH;const dctx=dark.getContext('2d');
function drawMap(now){
  const m=cur,fr=Math.floor(now/420)%2,night=m.out&&isNight();
  let cx=Math.round(H.px+8-VW/2),cy=Math.round(H.py+8-VH/2);
  const mw=m.w*TS,mh=m.h*TS;cx=mw<=VW?-(VW-mw)/2:Math.max(0,Math.min(mw-VW,cx));cy=mh<=VH?-(VH-mh)/2:Math.max(0,Math.min(mh-VH,cy));cx=Math.round(cx);cy=Math.round(cy);
  ctx.fillStyle='#0e0c1c';ctx.fillRect(0,0,VW,VH);
  const x0=Math.floor(cx/TS),y0=Math.floor(cy/TS),lights=[];
  for(let y=y0;y<=y0+12;y++)for(let x=x0;x<=x0+15;x++){
    if(x<0||y<0||x>=m.w||y>=m.h)continue;const ch=m.rows[y][x],l=LEG[ch]||LEG['.'];let g=l.g||m.base;if(g==='wallwin'&&night)g='wallwinN';
    const sx=x*TS-cx,sy=y*TS-cy;let t=TIL[g];if(Array.isArray(t))t=t[fr];ctx.drawImage(t,sx,sy);
    if(l.o){let o=TIL[l.o];if(Array.isArray(o))o=o[fr];ctx.drawImage(o,sx,sy)}
    if(ch==='i'||ch==='c')lights.push([sx+8,sy+6,34]);if(ch==='n'&&night)lights.push([sx+8,sy+10,22]);
  }
  for(const c of m.chests)ctx.drawImage(S.chests[c.id]?TIL.chestOpen:TIL.chest,c.x*TS-cx,c.y*TS-cy);
  if(m.id==='forest'&&!S.flags.herb){ctx.drawImage(TIL.herb[fr],33*TS-cx,34*TS-cy);lights.push([33*TS-cx+8,34*TS-cy+6,26])}
  const ents=npcsNow().map(n=>({y:n.py,px:n.px,spr:charSprites(n.spr)[n.dir][n.moving?[1,0,2,0][Math.floor(n.anim*7)%4]:0]}));
  ents.push({y:H.py+.1,px:H.px,spr:charSprites('hero')[H.dir][H.moving?[1,0,2,0][Math.floor(H.anim*9)%4]:0]});
  if(S.pal&&m.out){}
  ents.sort((a,b)=>a.y-b.y);for(const e of ents)ctx.drawImage(e.spr,Math.round(e.px)-cx,Math.round(e.y)-cy-3);
  if(m.out){const p=phase();
    if(p==='dusk'){ctx.fillStyle='rgba(255,120,40,.2)';ctx.fillRect(0,0,VW,VH)}
    else if(p==='dawn'){ctx.fillStyle='rgba(255,170,150,.16)';ctx.fillRect(0,0,VW,VH)}
    else if(p==='night'){dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,VW,VH);dctx.fillStyle='rgba(8,10,46,.72)';dctx.fillRect(0,0,VW,VH);dctx.globalCompositeOperation='destination-out';
      lights.push([Math.round(H.px)-cx+8,Math.round(H.py)-cy+6,50+Math.sin(now/300)*2]);
      for(const [lx,ly,r] of lights){const g=dctx.createRadialGradient(lx,ly,r*.25,lx,ly,r);g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(1,'rgba(0,0,0,0)');dctx.fillStyle=g;dctx.fillRect(lx-r,ly-r,r*2,r*2)}
      ctx.drawImage(dark,0,0);ctx.fillStyle='rgba(255,170,60,.06)';ctx.fillRect(0,0,VW,VH)}}
}
let bgDay=null,bgNight=null;
function battleBg(night){
  const c=document.createElement('canvas');c.width=VW;c.height=VH;const x=c.getContext('2d'),r=rng(night?5:9);
  const sky=night?['#0b0d2e','#1c2452','#2b3a6a']:['#8fd3f0','#b9e6d8','#dff3c8'];
  sky.forEach((col,i)=>{x.fillStyle=col;x.fillRect(0,i*28,VW,28+ (i===2?40:0))});
  if(night){x.fillStyle='#fff';for(let i=0;i<30;i++)x.fillRect(Math.floor(r()*VW),Math.floor(r()*70),1,1);x.fillStyle='#fff3c0';x.beginPath();x.arc(196,34,10,0,7);x.fill()}
  const tree=(tx,ty,s,col,col2)=>{x.fillStyle=col2;x.fillRect(tx-2,ty,4,s);x.fillStyle=col;for(let i=0;i<3;i++){const w=s*(.9-i*.2);x.beginPath();x.moveTo(tx,ty-s*.9-i*s*.35);x.lineTo(tx-w/2,ty-i*s*.35+2);x.lineTo(tx+w/2,ty-i*s*.35+2);x.fill()}};
  for(let i=0;i<14;i++)tree(8+i*18+r()*6,104,22+r()*10,night?'#16224a':'#4f9a5a',night?'#101838':'#3f7a4a');
  for(let i=0;i<9;i++)tree(i*30+r()*10,114,34+r()*12,night?'#0f1a3a':'#2f7d3a',night?'#0a122c':'#5a4630');
  x.fillStyle=night?'#17304a':'#62b450';x.fillRect(0,110,VW,82);x.fillStyle=night?'#1d3a55':'#72c35e';for(let i=0;i<60;i++)x.fillRect(Math.floor(r()*VW),112+Math.floor(r()*78),2,1);
  x.fillStyle=night?'#122840':'#55a546';for(let i=0;i<60;i++)x.fillRect(Math.floor(r()*VW),112+Math.floor(r()*78),2,1);
  return c;
}
function drawBattle(now){
  const bg=B.night?(bgNight||(bgNight=battleBg(true))):(bgDay||(bgDay=battleBg(false)));
  let ox=0;if(B.shake>0){B.shake--;ox=(B.shake%2?1:-1)*3}
  ctx.drawImage(bg,ox,0);
  const n=B.en.length;
  B.en.forEach((e,i)=>{
    if(e.dead){e.alpha=Math.max(0,e.alpha-.06);if(e.alpha<=0)return}
    const sp=monSprite(e.id),gap=n===3?72:78,x=Math.round(120+(i-(n-1)/2)*gap-sp.width/2)+ox,bob=e.dead?0:Math.round(Math.sin(now/380+i*1.7)*(e.id==='hane'||e.id==='yorubi'?3:1));
    const y=126-sp.height+bob-(e.id==='hane'||e.id==='yorubi'?8:0);
    if(e.flash>0){e.flash--;if(e.flash%4<2)return}
    ctx.globalAlpha=.25*e.alpha;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x+sp.width/2,128,sp.width*.36,4,0,0,7);ctx.fill();
    ctx.globalAlpha=e.alpha;ctx.drawImage(sp,x,y);ctx.globalAlpha=1;
    if(e.charged&&Math.floor(now/150)%2){ctx.fillStyle='#ffd96a';ctx.fillRect(x+sp.width/2-1,y-8,3,5);ctx.fillRect(x+sp.width/2-1,y-2,3,2)}
    if(e.tamed&&!e.dead){ctx.fillStyle='#ff7a9a';const hx=x+sp.width-6,hy=y+2;ctx.fillRect(hx,hy,2,2);ctx.fillRect(hx+3,hy,2,2);ctx.fillRect(hx,hy+2,5,1);ctx.fillRect(hx+1,hy+3,3,1);ctx.fillRect(hx+2,hy+4,1,1)}
    if(B.cursor===i&&Math.floor(now/200)%2){ctx.fillStyle='#ffb347';const tx=x+sp.width/2;ctx.beginPath();ctx.moveTo(tx-5,y-12);ctx.lineTo(tx+5,y-12);ctx.lineTo(tx,y-5);ctx.fill()}
  });
}
let titleBg=null;
function drawTitle(now){
  if(!titleBg){titleBg=document.createElement('canvas');titleBg.width=VW;titleBg.height=VH;const x=titleBg.getContext('2d'),r=rng(3);
    ['#0b0d2e','#141a48','#232c66','#3a3a7a'].forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,i*36,VW,60)});
    x.fillStyle='#fff';for(let i=0;i<50;i++)x.fillRect(Math.floor(r()*VW),Math.floor(r()*120),1,1);
    x.fillStyle='#1a2450';x.beginPath();x.moveTo(0,150);for(let i=0;i<=VW;i+=8)x.lineTo(i,140+Math.sin(i/30)*10+Math.sin(i/11)*3);x.lineTo(VW,VH);x.lineTo(0,VH);x.fill();
    x.fillStyle='#101838';x.beginPath();x.moveTo(0,170);for(let i=0;i<=VW;i+=8)x.lineTo(i,162+Math.sin(i/22+2)*7);x.lineTo(VW,VH);x.lineTo(0,VH);x.fill();
    x.fillStyle='#ffd96a';[[40,150],[52,154],[180,148],[196,152],[205,146]].forEach(p=>x.fillRect(p[0],p[1],2,2))}
  ctx.drawImage(titleBg,0,0);
  const g=ctx.createRadialGradient(120,128,2,120,128,34+Math.sin(now/400)*2);g.addColorStop(0,'rgba(255,190,90,.55)');g.addColorStop(1,'rgba(255,190,90,0)');ctx.fillStyle=g;ctx.fillRect(80,90,80,80);
  ctx.drawImage(charSprites('hero').down[0],112,118);ctx.drawImage(monSprite('moko'),132,112,24,24);
}
let last=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);
  if(mode==='title')drawTitle(now);else if(mode==='battle'&&B)drawBattle(now);else drawMap(now);
  requestAnimationFrame(loop)}

/* ===================== はじまり ===================== */
async function titleScreen(){
  mode='title';$('title').hidden=false;const sv=loadSave();
  const opts=sv?['つづきから','はじめから']:['はじめる'];
  const c=await choose(opts,{cancel:false,cls:'inmsg'});
  audioInit();await fade(1);$('title').hidden=true;
  if(sv&&c===0){S=sv;applySound();mode='map';setMap(S.map,S.x,S.y,S.dir);await fade(0)}
  else{S=newState();applySound();mode='map';setMap('home',6,4,'left');await fade(0);
    busy=false;await run(async()=>{await talk('山あいの 小さな村 ヒダマリ。\nともしびの火を まもって くらす\nおだやかな 村。','ある朝 少年ルカは\nおばあちゃんの声で 目をさました。','おばあちゃん「ルカや おきたかい。\n村長さんが おまえを よんでいたよ。\n北の 大きな家に 行ってごらん。」')})}
}
buildTiles();setupWorld();fit();applySound();requestAnimationFrame(loop);
window.G={get S(){return S},H,MAPS,setMap,run,encounter,battle,press,get B(){return B},get mode(){return mode},get busy(){return busy}};
(function boot(){busy=true;titleScreen().finally(()=>{busy=false;hideMsg();updateChip()})})();
</script>
